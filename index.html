<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTOFALO — Phụ kiện xe chính hãng</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root{
    --ink:#EDEDE8;
    --ink-dim:#A6A9B2;
    --asphalt:#14161A;
    --panel:#1D2026;
    --panel-2:#252932;
    --line:#3A3F4A;
    --yellow:#F2B705;
    --orange:#E85D2C;
    --danger:#E14B4B;
    --good:#4BBE7E;
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--asphalt);color:var(--ink);font-family:var(--font-body);}
  #af-root{min-height:100vh;position:relative;}

  .hazard{
    height:10px;
    background:repeating-linear-gradient(135deg, var(--yellow) 0 18px, var(--asphalt) 18px 36px);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }

  header.af-header{
    position:sticky; top:0; z-index:20;
    background:rgba(20,22,26,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .af-nav{
    max-width:1180px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .af-logo{
    font-family:var(--font-display); font-size:26px; letter-spacing:2px;
    text-transform:uppercase; color:var(--ink); cursor:pointer; user-select:none;
    display:flex; align-items:baseline; gap:6px;
  }
  .af-logo span{color:var(--yellow);}
  .af-menu{display:flex; gap:28px; font-family:var(--font-mono); font-size:13px; letter-spacing:1px; text-transform:uppercase;}
  .af-menu a{color:var(--ink-dim); text-decoration:none; cursor:pointer; transition:color .15s;}
  .af-menu a:hover{color:var(--yellow);}

  .af-hero{
    max-width:1180px; margin:0 auto; padding:72px 24px 56px;
    display:grid; grid-template-columns:1.2fr .8fr; gap:40px; align-items:center;
  }
  .af-eyebrow{
    font-family:var(--font-mono); color:var(--yellow); font-size:12px;
    letter-spacing:3px; text-transform:uppercase; margin-bottom:14px;
  }
  .af-hero h1{
    font-family:var(--font-display); font-size:clamp(40px,6vw,68px);
    line-height:1.02; margin:0 0 18px; text-transform:uppercase; letter-spacing:1px;
  }
  .af-hero h1 em{font-style:normal; color:var(--orange);}
  .af-hero p{color:var(--ink-dim); font-size:16px; line-height:1.6; max-width:46ch;}
  .af-hero-cta{display:flex; gap:14px; margin-top:26px; flex-wrap:wrap;}
  .btn{
    font-family:var(--font-mono); font-size:13px; letter-spacing:1px; text-transform:uppercase;
    padding:13px 22px; border-radius:2px; border:1px solid var(--line); cursor:pointer;
    background:transparent; color:var(--ink); transition:all .15s;
  }
  .btn:hover{border-color:var(--yellow); color:var(--yellow);}
  .btn.solid{background:var(--yellow); color:var(--asphalt); border-color:var(--yellow); font-weight:700;}
  .btn.solid:hover{background:#ffce33;}
  .btn.danger{border-color:var(--danger); color:var(--danger);}
  .btn.danger:hover{background:var(--danger); color:#fff;}
  .btn.good{border-color:var(--good); color:var(--good);}
  .btn.good:hover{background:var(--good); color:#0e1512;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .af-hero-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:22px;
    font-family:var(--font-mono); font-size:13px; color:var(--ink-dim);
  }
  .af-hero-panel .row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); gap:10px;}
  .af-hero-panel .row:last-child{border-bottom:none;}
  .af-hero-panel b{color:var(--ink); font-weight:600; text-align:right;}

  section{max-width:1180px; margin:0 auto; padding:56px 24px;}
  .sec-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:10px;}
  .sec-head h2{
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:1px;
    font-size:30px; margin:0; display:flex; align-items:center; gap:12px;
  }
  .sec-head h2:before{content:''; width:26px; height:4px; background:var(--orange); display:inline-block;}
  .sec-sub{font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase;}

  .af-filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px;}
  .chip{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5px; text-transform:uppercase;
    padding:7px 14px; border:1px solid var(--line); border-radius:20px; color:var(--ink-dim); cursor:pointer;
  }
  .chip.active{background:var(--yellow); color:var(--asphalt); border-color:var(--yellow); font-weight:700;}

  .af-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:20px;}
  .af-card{
    background:var(--panel); border:1px solid var(--line); border-radius:4px; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .15s, border-color .15s;
  }
  .af-card:hover{transform:translateY(-3px); border-color:var(--yellow);}
  .af-card .img-wrap{aspect-ratio:4/3; background:var(--panel-2); overflow:hidden; position:relative;}
  .af-card img{width:100%; height:100%; object-fit:cover; display:block;}
  .af-card .no-img{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-family:var(--font-mono); font-size:12px;}
  .af-card .cat-tag{
    position:absolute; top:10px; left:10px; background:var(--asphalt); color:var(--yellow);
    font-family:var(--font-mono); font-size:10px; letter-spacing:1px; text-transform:uppercase;
    padding:4px 8px; border-radius:2px; border:1px solid var(--yellow);
  }
  .af-card .body{padding:16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .af-card h3{margin:0; font-family:var(--font-display); font-size:18px; text-transform:uppercase; letter-spacing:.5px;}
  .af-card .desc{color:var(--ink-dim); font-size:13px; line-height:1.5; flex:1;}
  .af-card .note{color:var(--orange); font-size:12px; font-family:var(--font-mono);}
  .af-card .price-row{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
  .af-card .price{font-family:var(--font-mono); font-size:17px; color:var(--yellow); font-weight:700;}
  .empty-note{color:var(--ink-dim); font-family:var(--font-mono); font-size:13px; padding:40px 0; text-align:center; border:1px dashed var(--line); border-radius:4px;}

  .af-contact{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  .contact-card{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:26px;}
  .contact-card h3{font-family:var(--font-display); text-transform:uppercase; margin:0 0 16px; letter-spacing:.5px;}
  .contact-line{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; color:var(--ink-dim); align-items:center;}
  .contact-line:last-child{border-bottom:none;}
  .contact-line b{color:var(--ink); min-width:90px; font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.5px;}
  .social-row{display:flex; gap:12px; margin-top:18px; flex-wrap:wrap;}
  .social-btn{flex:1; text-align:center; padding:13px; border-radius:2px; text-decoration:none; font-family:var(--font-mono); font-size:13px; text-transform:uppercase; letter-spacing:1px; font-weight:700; min-width:120px;}
  .social-btn.zalo{background:#0068FF; color:#fff;}
  .social-btn.fb{background:#1877F2; color:#fff;}

  footer{border-top:1px solid var(--line); padding:26px 24px; text-align:center; color:var(--ink-dim); font-family:var(--font-mono); font-size:11px; letter-spacing:1px;}
  footer .admin-dot{cursor:pointer; opacity:.35; transition:opacity .15s; user-select:none;}
  footer .admin-dot:hover{opacity:1; color:var(--yellow);}

  .af-overlay{
    position:fixed; inset:0; background:rgba(10,11,13,0.78); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .af-modal{background:var(--panel); border:1px solid var(--line); border-radius:6px; width:100%; max-width:420px; padding:30px; box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .af-modal h3{font-family:var(--font-display); text-transform:uppercase; margin:0 0 6px; letter-spacing:.5px; font-size:22px;}
  .af-modal .sub{color:var(--ink-dim); font-size:13px; margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-dim); margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:3px; color:var(--ink);
    padding:10px 12px; font-family:var(--font-body); font-size:14px;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--yellow); outline-offset:1px; border-color:var(--yellow);}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .err-text{color:var(--danger); font-family:var(--font-mono); font-size:12px; margin-top:10px; min-height:16px;}

  .af-admin-shell{position:fixed; inset:0; background:var(--asphalt); z-index:90; overflow-y:auto;}
  .admin-top{position:sticky; top:0; background:rgba(20,22,26,0.95); border-bottom:1px solid var(--line); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; z-index:5; flex-wrap:wrap; gap:10px;}
  .admin-top h2{font-family:var(--font-display); text-transform:uppercase; margin:0; letter-spacing:1px; font-size:18px;}
  .admin-body{max-width:1000px; margin:0 auto; padding:30px 24px 80px;}
  .admin-tabs{display:flex; gap:10px; margin-bottom:26px;}
  .admin-tab{font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:1px; padding:10px 18px; border:1px solid var(--line); border-radius:3px; cursor:pointer; color:var(--ink-dim);}
  .admin-tab.active{background:var(--panel-2); color:var(--yellow); border-color:var(--yellow);}
  .admin-panel-box{background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:24px; margin-bottom:20px;}
  .admin-panel-box h3{font-family:var(--font-display); text-transform:uppercase; margin:0 0 18px; letter-spacing:.5px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  .admin-list-item{display:flex; gap:14px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:4px; margin-bottom:10px; background:var(--panel-2); flex-wrap:wrap;}
  .admin-list-item img{width:56px; height:56px; object-fit:cover; border-radius:3px; background:var(--panel);}
  .admin-list-item .noimg{width:56px; height:56px; border-radius:3px; background:var(--panel); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:9px; color:var(--ink-dim);}
  .admin-list-item .info{flex:1; min-width:150px;}
  .admin-list-item .info .n{font-weight:600; font-size:14px;}
  .admin-list-item .info .p{font-family:var(--font-mono); color:var(--yellow); font-size:13px;}
  .admin-list-item .actions{display:flex; gap:8px;}
  .admin-list-item .actions button{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; padding:7px 12px; border-radius:3px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink-dim);}
  .admin-list-item .actions button.edit:hover{color:var(--yellow); border-color:var(--yellow);}
  .admin-list-item .actions button.del:hover{color:var(--danger); border-color:var(--danger);}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--good); color:var(--good); font-family:var(--font-mono); font-size:13px; padding:12px 20px; border-radius:4px; z-index:200; max-width:90vw; text-align:center;}
  .toast.error{border-color:var(--danger); color:var(--danger);}
  .spin-note{font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); text-align:center; padding:40px;}
  .live-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--good); margin-right:6px; box-shadow:0 0 0 0 rgba(75,190,126,.6); animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(75,190,126,.5);}70%{box-shadow:0 0 0 6px rgba(75,190,126,0);}100%{box-shadow:0 0 0 0 rgba(75,190,126,0);}}

  @media(max-width:820px){
    .af-hero{grid-template-columns:1fr;}
    .af-contact{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
    .af-menu{display:none;}
  }
</style>
</head>
<body>
<div id="af-root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBr8akGvlbhv7TxBkJzAx6DrwBA5rRLjjg",
  authDomain: "webfalo-78228.firebaseapp.com",
  projectId: "webfalo-78228",
  storageBucket: "webfalo-78228.firebasestorage.app",
  messagingSenderId: "1022135923098",
  appId: "1:1022135923098:web:38710a834723f02366ca23",
  measurementId: "G-N2DD5B72JF"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const CATS = ["Nội thất","Ngoại thất","Đèn & Điện","Âm thanh","Chăm sóc xe","Khác"];

const DEFAULT_CONTACT = {
  shopName:"AUTOFALO",
  address:"123 Đường Cách Mạng Tháng 8, Quận 3, TP. Hồ Chí Minh",
  phone:"0909 123 456",
  hours:"8:00 - 20:00, Thứ 2 - Chủ Nhật",
  zalo:"https://zalo.me/0909123456",
  facebook:"https://facebook.com/autofalo"
};

const DEFAULT_PRODUCTS = [
  {id:"p1", name:"Bọc vô lăng da cao cấp", price:"350,000", category:"Nội thất", image:"", desc:"Da PU cao cấp, chống trơn trượt, dễ lắp đặt cho hầu hết dòng xe.", note:""},
  {id:"p2", name:"Đèn LED gầm xe", price:"890,000", category:"Đèn & Điện", image:"", desc:"Ánh sáng trắng 6000K, chống nước IP67, tăng tính thẩm mỹ ban đêm.", note:"Còn 5 bộ"},
  {id:"p3", name:"Thảm lót sàn 6D", price:"1,200,000", category:"Nội thất", image:"", desc:"Chất liệu cao su tổng hợp, chống thấm nước, vừa khít theo xe.", note:""},
  {id:"p4", name:"Loa Bluetooth trên xe", price:"650,000", category:"Âm thanh", image:"", desc:"Kết nối nhanh, âm bass mạnh, tương thích đa dòng xe.", note:"Bán chạy"}
];

let state = {
  products: DEFAULT_PRODUCTS,
  contact: DEFAULT_CONTACT,
  productsLoaded:false,
  contactLoaded:false,
  filter: "Tất cả",
  view: "site",
  adminTab: "products",
  isAuthed: false,
  authChecked:false,
  showLogin: false,
  loginErr: "",
  loginBusy:false,
  editingProduct: null,
  toast: null,
  saving:false
};

function render(){ draw(); }

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showToast(msg, isError){
  state.toast = {msg, isError};
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2400);
}

// ---- Firestore realtime listeners (public read, all visitors) ----
onSnapshot(doc(db,'autofalo','products'), snap=>{
  state.products = snap.exists() && Array.isArray(snap.data().list) ? snap.data().list : DEFAULT_PRODUCTS;
  state.productsLoaded = true;
  render();
}, err=>{ state.productsLoaded = true; render(); });

onSnapshot(doc(db,'autofalo','contact'), snap=>{
  state.contact = snap.exists() ? Object.assign({}, DEFAULT_CONTACT, snap.data()) : DEFAULT_CONTACT;
  state.contactLoaded = true;
  render();
}, err=>{ state.contactLoaded = true; render(); });

onAuthStateChanged(auth, user=>{
  state.isAuthed = !!user;
  state.authChecked = true;
  if(!user && state.view==='admin') state.view = 'site';
  render();
});

async function saveProducts(){
  state.saving = true; render();
  try {
    await setDoc(doc(db,'autofalo','products'), {list: state.products});
    showToast("Đã lưu sản phẩm cho mọi khách");
  } catch(e){ showToast("Lỗi khi lưu: " + (e.code || e.message), true); }
  state.saving = false; render();
}
async function saveContact(){
  state.saving = true; render();
  try {
    await setDoc(doc(db,'autofalo','contact'), state.contact);
    showToast("Đã lưu thông tin liên hệ");
  } catch(e){ showToast("Lỗi khi lưu: " + (e.code || e.message), true); }
  state.saving = false; render();
}

// ---------------- SITE RENDER ----------------
function siteHTML(){
  const c = state.contact;
  const filtered = state.filter === "Tất cả" ? state.products : state.products.filter(p=>p.category===state.filter);
  const chips = ["Tất cả", ...CATS];

  return `
    <header class="af-header">
      <div class="af-nav">
        <div class="af-logo"><span>AUTO</span>FALO</div>
        <nav class="af-menu">
          <a onclick="AF.scrollTo('products')">Sản phẩm</a>
          <a onclick="AF.scrollTo('about')">Giới thiệu</a>
          <a onclick="AF.scrollTo('contact')">Liên hệ</a>
        </nav>
      </div>
    </header>
    <div class="hazard"></div>

    <section class="af-hero">
      <div>
        <div class="af-eyebrow">Phụ kiện xe hơi &amp; xe máy chính hãng</div>
        <h1>NÂNG CẤP<br>XE CỦA BẠN<br><em>MỖI NGÀY.</em></h1>
        <p>${esc(c.shopName)} cung cấp phụ kiện nội – ngoại thất, đèn, âm thanh và chăm sóc xe. Xem sản phẩm thoải mái, không cần đăng ký tài khoản.</p>
        <div class="af-hero-cta">
          <button class="btn solid" onclick="AF.scrollTo('products')">Xem sản phẩm</button>
          <button class="btn" onclick="AF.scrollTo('contact')">Liên hệ ngay</button>
        </div>
      </div>
      <div class="af-hero-panel">
        <div class="row"><span>Cửa hàng</span><b>${esc(c.shopName)}</b></div>
        <div class="row"><span>Giờ mở cửa</span><b>${esc(c.hours)}</b></div>
        <div class="row"><span>Hotline</span><b>${esc(c.phone)}</b></div>
        <div class="row"><span>Số sản phẩm</span><b>${state.products.length} mặt hàng</b></div>
      </div>
    </section>

    <section id="products">
      <div class="sec-head">
        <h2>Sản phẩm</h2>
        <div class="sec-sub"><span class="live-dot"></span>${filtered.length} sản phẩm</div>
      </div>
      <div class="af-filters">
        ${chips.map(ct=>`<div class="chip ${state.filter===ct?'active':''}" onclick="AF.setFilter('${esc(ct)}')">${esc(ct)}</div>`).join('')}
      </div>
      ${filtered.length===0 ? `<div class="empty-note">Chưa có sản phẩm nào trong danh mục này.</div>` : `
      <div class="af-grid">
        ${filtered.map(p=>`
          <div class="af-card">
            <div class="img-wrap">
              ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.parentElement.innerHTML='<div class=&quot;no-img&quot;>Không tải được ảnh</div>'">` : `<div class="no-img">Chưa có ảnh</div>`}
              <div class="cat-tag">${esc(p.category)}</div>
            </div>
            <div class="body">
              <h3>${esc(p.name)}</h3>
              <div class="desc">${esc(p.desc)}</div>
              ${p.note ? `<div class="note">${esc(p.note)}</div>` : ``}
              <div class="price-row"><div class="price">${esc(p.price)}₫</div></div>
            </div>
          </div>
        `).join('')}
      </div>`}
    </section>

    <section id="about">
      <div class="sec-head"><h2>Giới thiệu</h2></div>
      <p style="color:var(--ink-dim); max-width:70ch; line-height:1.7;">
        ${esc(c.shopName)} là cửa hàng chuyên phụ kiện xe hơi và xe máy, với các dòng sản phẩm nội thất, ngoại thất,
        đèn, âm thanh và chăm sóc xe. Sản phẩm được cập nhật thường xuyên — ghé lại để xem hàng mới.
      </p>
    </section>

    <section id="contact">
      <div class="sec-head"><h2>Liên hệ</h2></div>
      <div class="af-contact">
        <div class="contact-card">
          <h3>Thông tin cửa hàng</h3>
          <div class="contact-line"><b>Địa chỉ</b><span>${esc(c.address)}</span></div>
          <div class="contact-line"><b>Điện thoại</b><span>${esc(c.phone)}</span></div>
          <div class="contact-line"><b>Giờ mở cửa</b><span>${esc(c.hours)}</span></div>
        </div>
        <div class="contact-card">
          <h3>Nhắn tin nhanh</h3>
          <p style="color:var(--ink-dim); font-size:13px;">Liên hệ trực tiếp qua Zalo hoặc Facebook để được tư vấn.</p>
          <div class="social-row">
            <a class="social-btn zalo" href="${esc(c.zalo)}" target="_blank" rel="noopener">Chat Zalo</a>
            <a class="social-btn fb" href="${esc(c.facebook)}" target="_blank" rel="noopener">Facebook</a>
          </div>
        </div>
      </div>
    </section>

    <footer>
      © ${new Date().getFullYear()} ${esc(c.shopName)} — Phụ kiện xe chính hãng.
      <span class="admin-dot" onclick="AF.openLogin()"> · </span>
    </footer>

    ${state.showLogin ? loginModalHTML() : ''}
    ${state.toast ? `<div class="toast ${state.toast.isError?'error':''}">${esc(state.toast.msg)}</div>` : ''}
  `;
}

function loginModalHTML(){
  return `
    <div class="af-overlay" onclick="if(event.target===this) AF.closeLogin()">
      <div class="af-modal">
        <h3>Quản trị viên</h3>
        <div class="sub">Đăng nhập bằng tài khoản admin để chỉnh sửa nội dung.</div>
        <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@..." ${state.loginBusy?'disabled':''}></div>
        <div class="field"><label>Mật khẩu</label><input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter') AF.tryLogin()" ${state.loginBusy?'disabled':''}></div>
        <div class="err-text">${esc(state.loginErr)}</div>
        <div class="modal-actions">
          <button class="btn" onclick="AF.closeLogin()" ${state.loginBusy?'disabled':''}>Huỷ</button>
          <button class="btn solid" onclick="AF.tryLogin()" ${state.loginBusy?'disabled':''}>${state.loginBusy?'Đang đăng nhập...':'Đăng nhập'}</button>
        </div>
      </div>
    </div>
  `;
}

// ---------------- ADMIN RENDER ----------------
function adminHTML(){
  return `
    <div class="af-admin-shell">
      <div class="admin-top">
        <h2>Bảng quản trị · AUTOFALO</h2>
        <div style="display:flex; gap:10px;">
          <button class="btn" onclick="AF.backToSite()">Xem trang web</button>
          <button class="btn danger" onclick="AF.logout()">Đăng xuất</button>
        </div>
      </div>
      <div class="admin-body">
        <div class="admin-tabs">
          <div class="admin-tab ${state.adminTab==='products'?'active':''}" onclick="AF.setAdminTab('products')">Sản phẩm</div>
          <div class="admin-tab ${state.adminTab==='contact'?'active':''}" onclick="AF.setAdminTab('contact')">Thông tin liên hệ</div>
        </div>
        ${state.adminTab==='products' ? adminProductsHTML() : adminContactHTML()}
      </div>
    </div>
    ${state.editingProduct ? productFormModalHTML() : ''}
    ${state.toast ? `<div class="toast ${state.toast.isError?'error':''}">${esc(state.toast.msg)}</div>` : ''}
  `;
}

function adminProductsHTML(){
  return `
    <div class="admin-panel-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <h3 style="margin:0;">Danh sách sản phẩm (${state.products.length})</h3>
        <button class="btn solid" onclick="AF.newProduct()" ${state.saving?'disabled':''}>+ Thêm sản phẩm</button>
      </div>
      ${state.products.length===0 ? `<div class="empty-note">Chưa có sản phẩm. Nhấn "+ Thêm sản phẩm" để bắt đầu.</div>` :
        state.products.map(p=>`
          <div class="admin-list-item">
            ${p.image ? `<img src="${esc(p.image)}" onerror="this.outerHTML='<div class=&quot;noimg&quot;>N/A</div>'">` : `<div class="noimg">N/A</div>`}
            <div class="info">
              <div class="n">${esc(p.name)} <span style="color:var(--ink-dim); font-weight:400;">· ${esc(p.category)}</span></div>
              <div class="p">${esc(p.price)}₫</div>
            </div>
            <div class="actions">
              <button class="edit" onclick="AF.editProduct('${p.id}')">Sửa</button>
              <button class="del" onclick="AF.deleteProduct('${p.id}')">Xoá</button>
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
}

function adminContactHTML(){
  const c = state.contact;
  return `
    <div class="admin-panel-box">
      <h3>Thông tin cửa hàng</h3>
      <div class="form-grid">
        <div class="field"><label>Tên cửa hàng</label><input id="c_shopName" value="${esc(c.shopName)}"></div>
        <div class="field"><label>Điện thoại</label><input id="c_phone" value="${esc(c.phone)}"></div>
        <div class="field full"><label>Địa chỉ</label><input id="c_address" value="${esc(c.address)}"></div>
        <div class="field"><label>Giờ mở cửa</label><input id="c_hours" value="${esc(c.hours)}"></div>
        <div class="field"><label>Link Zalo</label><input id="c_zalo" value="${esc(c.zalo)}"></div>
        <div class="field full"><label>Link Facebook</label><input id="c_facebook" value="${esc(c.facebook)}"></div>
      </div>
      <div class="modal-actions" style="max-width:260px;">
        <button class="btn good" onclick="AF.saveContactForm()" ${state.saving?'disabled':''}>${state.saving?'Đang lưu...':'Lưu thay đổi'}</button>
      </div>
    </div>
  `;
}

function productFormModalHTML(){
  const p = state.editingProduct;
  const isNew = !p.id;
  return `
    <div class="af-overlay" onclick="if(event.target===this) AF.cancelEditProduct()">
      <div class="af-modal" style="max-width:520px;">
        <h3>${isNew ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}</h3>
        <div class="sub">Điền thông tin sản phẩm và lưu lại.</div>
        <div class="form-grid">
          <div class="field full"><label>Tên sản phẩm</label><input id="pf_name" value="${esc(p.name||'')}"></div>
          <div class="field"><label>Giá (VNĐ)</label><input id="pf_price" value="${esc(p.price||'')}" placeholder="ví dụ 350,000"></div>
          <div class="field">
            <label>Danh mục</label>
            <select id="pf_category">
              ${CATS.map(ct=>`<option value="${esc(ct)}" ${p.category===ct?'selected':''}>${esc(ct)}</option>`).join('')}
            </select>
          </div>
          <div class="field full"><label>Link hình ảnh (URL)</label><input id="pf_image" value="${esc(p.image||'')}" placeholder="https://..."></div>
          <div class="field full"><label>Mô tả</label><textarea id="pf_desc">${esc(p.desc||'')}</textarea></div>
          <div class="field full"><label>Ghi chú (không bắt buộc)</label><input id="pf_note" value="${esc(p.note||'')}" placeholder="ví dụ: Bán chạy, Còn 3 sản phẩm"></div>
        </div>
        <div class="modal-actions">
          <button class="btn" onclick="AF.cancelEditProduct()">Huỷ</button>
          <button class="btn solid" onclick="AF.submitProduct()" ${state.saving?'disabled':''}>${state.saving?'Đang lưu...':'Lưu sản phẩm'}</button>
        </div>
      </div>
    </div>
  `;
}

function draw(){
  const root = document.getElementById('af-root');
  if(!state.productsLoaded || !state.contactLoaded || !state.authChecked){
    root.innerHTML = `<div class="spin-note">Đang tải dữ liệu...</div>`;
    return;
  }
  root.innerHTML = state.view === 'admin' ? adminHTML() : siteHTML();
}

window.AF = {
  scrollTo(id){ const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); },
  setFilter(f){ state.filter = f; render(); },

  openLogin(){ state.showLogin = true; state.loginErr=""; render(); setTimeout(()=>{ const i=document.getElementById('loginEmail'); if(i) i.focus(); },50); },
  closeLogin(){ state.showLogin = false; render(); },
  async tryLogin(){
    const email = (document.getElementById('loginEmail')||{}).value || "";
    const pass = (document.getElementById('loginPass')||{}).value || "";
    if(!email || !pass){ state.loginErr = "Vui lòng nhập email và mật khẩu."; render(); return; }
    state.loginBusy = true; state.loginErr=""; render();
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      state.showLogin = false;
      state.view = 'admin';
      state.loginBusy = false;
      render();
    } catch(e){
      state.loginBusy = false;
      state.loginErr = "Đăng nhập thất bại: sai email hoặc mật khẩu.";
      render();
    }
  },
  async logout(){ await signOut(auth); state.view = 'site'; render(); },
  backToSite(){ state.view = 'site'; render(); },
  setAdminTab(t){ state.adminTab = t; render(); },

  newProduct(){ state.editingProduct = {}; render(); },
  editProduct(id){ state.editingProduct = Object.assign({}, state.products.find(p=>p.id===id)); render(); },
  cancelEditProduct(){ state.editingProduct = null; render(); },
  submitProduct(){
    const name = document.getElementById('pf_name').value.trim();
    const price = document.getElementById('pf_price').value.trim();
    const category = document.getElementById('pf_category').value;
    const image = document.getElementById('pf_image').value.trim();
    const desc = document.getElementById('pf_desc').value.trim();
    const note = document.getElementById('pf_note').value.trim();
    if(!name || !price){ showToast("Vui lòng nhập tên và giá sản phẩm", true); return; }

    if(state.editingProduct.id){
      const idx = state.products.findIndex(p=>p.id===state.editingProduct.id);
      state.products[idx] = Object.assign({}, state.products[idx], {name,price,category,image,desc,note});
    } else {
      state.products.push({id:'p'+Date.now(), name, price, category, image, desc, note});
    }
    state.editingProduct = null;
    render();
    saveProducts();
  },
  deleteProduct(id){
    if(!confirm("Xoá sản phẩm này?")) return;
    state.products = state.products.filter(p=>p.id!==id);
    render();
    saveProducts();
  },
  saveContactForm(){
    state.contact = {
      shopName: document.getElementById('c_shopName').value.trim() || DEFAULT_CONTACT.shopName,
      phone: document.getElementById('c_phone').value.trim(),
      address: document.getElementById('c_address').value.trim(),
      hours: document.getElementById('c_hours').value.trim(),
      zalo: document.getElementById('c_zalo').value.trim(),
      facebook: document.getElementById('c_facebook').value.trim()
    };
    render();
    saveContact();
  }
};

render();
</script>
</body>
</html>
